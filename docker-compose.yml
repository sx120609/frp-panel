services:
  frp-panel:
    build:
      context: .
      args:
        FRP_VERSION: ${FRP_VERSION:-0.61.1}
        FRP_DOWNLOAD_MIRRORS: ${FRP_DOWNLOAD_MIRRORS:-}
    container_name: frp-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "7000:7000"
      - "7500:7500"
    environment:
      PORT: 8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DATA_DIR: /app/data
      FRPS_BIN: /usr/local/bin/frps
      FRPS_AUTO_START: "true"
      FRP_VERSION: ${FRP_VERSION:-0.61.1}
      FRP_DOWNLOAD_BASE_URL: ${FRP_DOWNLOAD_BASE_URL:-https://github.com/fatedier/frp/releases/download}
      FRP_DOWNLOAD_MIRRORS: ${FRP_DOWNLOAD_MIRRORS:-}
    volumes:
      - ./data:/app/data
      - ./generated:/app/generated
